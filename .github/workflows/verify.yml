name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      # Two checks, because they catch different things. The validator checks
      # schema and syntax; it accepts any string in `extends`, so a preset name
      # that does not exist still passes. Resolving the presets is what catches
      # that, and it is how `:pinDigests` reached every consumer.
      - name: Validate and resolve the shared preset
        run: npm run verify
