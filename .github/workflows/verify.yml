name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # The validator checks schema and syntax only. It does not resolve preset
      # names, so an invalid preset reference still has to be caught by the
      # hosted Renovate run, as `:pinDigests` was.
      - name: Validate the shared preset
        run: npx --yes --package renovate renovate-config-validator --strict default.json renovate.json
